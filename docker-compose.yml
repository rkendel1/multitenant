# =============================================================================
# Multitenant Docker Compose Configuration
# =============================================================================
# This configuration provides a "batteries included" setup for the multitenant
# application with PostgreSQL, local Convex backend, and all required services.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose down               # Stop all services
#   docker compose logs -f            # Follow logs
#   docker compose exec app bash      # Shell into app container
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: multitenant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multitenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant_secret}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multitenant} -d ${POSTGRES_DB:-multitenant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multitenant-network

  # ---------------------------------------------------------------------------
  # Local Convex Backend (Development)
  # ---------------------------------------------------------------------------
  # Note: Convex does not have an official self-hosted option.
  # This provides a mock/local development server for testing Convex integration.
  # For production, use Convex Cloud (https://convex.dev)
  convex-local:
    build:
      context: ./docker
      dockerfile: Dockerfile.convex-local
    container_name: multitenant-convex-local
    restart: unless-stopped
    environment:
      CONVEX_PORT: ${CONVEX_PORT:-3210}
      NODE_ENV: development
    ports:
      - "${CONVEX_PORT:-3210}:3210"
    volumes:
      - convex_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3210/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multitenant-network

  # ---------------------------------------------------------------------------
  # Node.js Application (JS/TS)
  # ---------------------------------------------------------------------------
  app-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: multitenant-app-node
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-multitenant}:${POSTGRES_PASSWORD:-multitenant_secret}@postgres:5432/${POSTGRES_DB:-multitenant_db}
      CONVEX_DEPLOYMENT_URL: http://convex-local:3210
      MULTITENANT_BASE_DOMAIN: ${MULTITENANT_BASE_DOMAIN:-localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MULTITENANT_ADMIN_EMAIL: ${MULTITENANT_ADMIN_EMAIL:-admin@example.com}
      MULTITENANT_ADMIN_PASSWORD: ${MULTITENANT_ADMIN_PASSWORD:-admin123}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./js:/app/js:ro
      - node_modules:/app/js/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      convex-local:
        condition: service_healthy
    networks:
      - multitenant-network
    profiles:
      - node
      - full

  # ---------------------------------------------------------------------------
  # Python/Django Application
  # ---------------------------------------------------------------------------
  app-python:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: multitenant-app-python
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-multitenant}:${POSTGRES_PASSWORD:-multitenant_secret}@postgres:5432/${POSTGRES_DB:-multitenant_db}
      CONVEX_DEPLOYMENT_URL: http://convex-local:3210
      CONVEX_API_TOKEN: ${CONVEX_API_TOKEN:-}
      MULTITENANT_BASE_DOMAIN: ${MULTITENANT_BASE_DOMAIN:-localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MULTITENANT_ADMIN_EMAIL: ${MULTITENANT_ADMIN_EMAIL:-admin@example.com}
      MULTITENANT_ADMIN_PASSWORD: ${MULTITENANT_ADMIN_PASSWORD:-admin123}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - ./py:/app/py:ro
    depends_on:
      postgres:
        condition: service_healthy
      convex-local:
        condition: service_healthy
    networks:
      - multitenant-network
    profiles:
      - python
      - full

  # ---------------------------------------------------------------------------
  # Redis (Optional - for caching and sessions)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: multitenant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multitenant-network
    profiles:
      - cache
      - full

  # ---------------------------------------------------------------------------
  # Adminer (Database Admin UI)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: multitenant-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - multitenant-network
    profiles:
      - admin
      - full

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  convex_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  multitenant-network:
    driver: bridge
